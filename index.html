<!DOCTYPE html>
<html>
<!-- REMEMBER TO DO THE STRUCTURE FIRST, THEN YOU FILL IT -->

<head>
  <meta charset="UTF-8">
  <title></title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="player" id="player-bottom-right">
    <div id="card1"></div>
  </div>
  <div class="contrary" id="player-top-left">
    <div id="card2"></div>
  </div>
  <div class="contrary" id="player-top-right">
    <div id="card3"></div>
  </div>
  <div class="contrary" id="player-bottom-left">
    <div id="card4"></div>
  </div>
  <div id="center">
    <div id="central-card-one"></div>
    <div id="central-card-two"></div>
  </div>
  <div id="center-top">
    <p>SCOREBOARD</p>
  </div>
  <div id="center-bottom">

    <div>

      <form id="game-setup">
        <label for="rounds">Rounds</label>
        <select id="input-rounds" , name="input_rounds"></select>

        <label for="starting-balance">Balance</label>
        <input type="number" id="input-starting-balance" name="input_starting_balance"><br>
        <button type="submit" id="start-game">Start!</button>
      </form>

    </div>

    <div id="player-choice">
      <button id="pull-card">Pull</button>
      <button id="stand">Stand</button>
    </div>
  </div>
  <div id="center-left">
    <p>TABLE INFO</p>
  </div>
  <div id="center-right">
    <p>IDK</p>
  </div>
  <script type="module" src="index.js"></script>
</body>


</html>
